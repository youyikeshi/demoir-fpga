# 权重注册表 —— 告诉项目"哪个文件是什么模型"
#
# 为什么需要这个文件
# ----------------
# 权重文件名（checkpoint_latest.tar / checkpoint_000150.tar）本身不说它是 teacher 还是
# student，也不说该用哪套通道数。多机协作时最容易踩的坑就是"权重放对了但结构参数错了"，
# 报错又很难懂（strict=True 加载失败会列一长串 missing keys）。
#
# 所以：**凡是项目里要用到的权重，都在这里登记**。脚本只写逻辑名，路径与结构参数由此解析。
#
# 字段
# ----
#   file  : 相对 weights/ 的路径（也可写绝对路径）
#   arch  : 构造网络用的结构参数（必须与该 checkpoint 严格一致）
#   note  : 说明来源
#   run   : 若是自己训练产出的，记录它来自哪个 runs/<run>（便于追溯）
#
# 用法（在 src/configs/*.yaml 里）
# -----------------------------
#   TEACHER_MODEL:
#     TEACHER: ghost_34large      # 名字，不是路径
#
# 训练时 B 机不需要改任何路径；只要把 weights/ 从移动硬盘还原到位即可。

teacher:
  ghost_34large:
    file: teacher/ghost_34large_UHDM_ep150.tar
    arch: {en_f: 48, en_i: 48, de_f: 64, de_i: 64, sam: 1}
    note: >-
      论文作者的 teacher（ESDNet ghost_34large），在 UHDM 4K 上训练到第 150 epoch。
      不是我们的产物。50.8 MB / 4.396 M 参数。

student:
  # ★ 当前推荐的 student（全量训练，已逼近 teacher 上界）
  uhdm4k_s640_ep150:
    file: student/uhdm4k_s640_ep150.tar
    arch: {en_f: 48, en_i: 32, de_f: 64, de_i: 32, sam: 1}
    run: 2026-09-14_uhdm4k_s640_ep150
    note: >-
      我们的 student，**官方全量训练集 4500 对**跑满 150 epoch / 337,500 步（论文量级）。
      crop 640（官方 768 在 12GB 卡上跑不动，见 docs/训练/说明_本机重训环境搭建.md 5.2）。
      18.3 MB / 1.562 M 参数。评估 Δ +4.70 dB / SSIM 0.7735（400 块），
      teacher 上界为 +4.80 / 0.7777 —— 用 36% 参数量达到其 98% 的画质。

  uhdm4k_s512_ep30:
    file: student/uhdm4k_s512_ep30.tar
    arch: {en_f: 48, en_i: 32, de_f: 64, de_i: 32, sam: 1}
    run: 2026-09-10_uhdm4k_s512
    note: >-
      早期 student，30 epoch / 6000 步，只用了 UHDM test 划分出的 400 张图。
      评估 Δ +2.50 dB。**已被上面的 uhdm4k_s640_ep150 取代**，保留作为对照基线。

binary:
  # ★ 二值模型（W1A1，BinaryDemoire 复现）发布版
  #   加载必须用 tools/bin_loader.py —— 结构由**环境变量在 import 时**决定，
  #   直接 my_model(...) 再 load_state_dict(strict=True) 会因 MODE 不对报 missing keys。
  binary_demoire_base_ep150:
    file: student/binary_demoire_base_ep150.tar
    arch: {en: 48, en_i: 64, de: 64, de_i: 96, sam: 1}
    env: {DEMOIR_BIN: '1', DEMOIR_MODE: base, DEMOIR_RDB: '1'}
    run: bin_base
    note: >-
      我们的二值 student（base 档：纯 W1A1，**未启用** MABG/SGRA），官方全量训练集 4500 对
      跑满 150 epoch / 337500 步。23.4 MB / 5.960 M 参数（二值等价 0.303 M，227 个二值层）。
      评估（400 块，口径同 dense）：均值 17.9809 / 中位 17.8438 / SSIM 中位 0.7771；
      相对 dense 基线 19.7995/19.1906/0.8144 掉 -1.82 dB / -1.35 dB / -0.037，
      **只有论文掉幅（-2.76 dB）的 66%**。
      训练与评估全过程见 docs/训练/记录_20261030_二值化复现与评估.md。
