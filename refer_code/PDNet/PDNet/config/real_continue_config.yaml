GENERAL:
  GPU_ID: 0
  SEED: 123
  WORKER: 4
  SAVE_PREFIX: './out_dir/real/'
  # 与 real_config.yaml 的 SAVE_PREFIX + EXP_NAME 组合后仍是
  # ./out_dir/real/exp_real，所以续训会用同一个目录、同一批 checkpoint。
  EXP_NAME: 'exp_real'

DATA:
  DATA_TYPE: UHDM
  TRAIN_DATASET: '../../../uhdm_data/split_train'
  TEST_DATASET: '../../../uhdm_data/split_eval'

MODEL:
  EN_FEATURE_NUM: 48
  EN_INTER_NUM: 32
  DE_FEATURE_NUM: 64
  DE_INTER_NUM: 32
  SAM_NUMBER: 1

TEACHER_MODEL:
  Teacher: nets_teacher
  T_en_f: 48
  T_en_i: 48
  T_de_f: 64
  T_de_i: 64
  T_sam: 1
  T_load_path: './Teacher_checkpoint/ghost_34large/UHDM/checkpoint_000150.tar'

# 是否使用 teacher 蒸馏。默认 True；设为 False 则只做 多尺度L1 + VGG感知。
# 动机：4K 训练的 teacher 在下采样数据上指导能力掉 2.3~2.9 dB，
# 见 docs/交付说明_20260910.md 3.4 假设2。
USE_TEACHER: True

TRAIN:
  BATCH_SIZE: 2
  LOADER: crop
  CROP_SIZE: 512
  RESIZE_SIZE: 384
  SAVE_ITER: 200
  # 从 epoch 30 继续（checkpoint_000030.tar 已存在）
  LOAD_EPOCH: 30
  LAM: 1
  LAM_P: 1

TEST:
  TEST_EPOCH: 'auto'
  SAVE_IMG: False
  LOAD_PATH: False
  EVALUATION_METRIC: True
  EVALUATION_TIME: False
  EVALUATION_COST: False

SOLVER:
  # 继续训到 100 epoch（再 70 个 epoch = 14000 步）
  EPOCHS: 100
  T_0: 50
  T_MULT: 1
  ETA_MIN: 0.000001
  BASE_LR: 0.0002

# 每 5 个 epoch 存一次盘（本机内存不稳、已 6 次蓝屏，缩短崩溃代价）
SAVE_EPOCH: 5
