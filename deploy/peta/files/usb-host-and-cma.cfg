# ═══════════════════════════════════════════════════════════════════════════
# usb-host-and-cma.cfg — USB Host(NCM 网卡/摄像头) + CMA 512MB
# 内核：linux-xlnx 6.12.40-v2025.2（Xilinx fork），符号已逐个对 Kconfig 核对
# ═══════════════════════════════════════════════════════════════════════════

# ── Zynq-7000 USB Host（chipidea + 内部 ULPI viewport）──────────────────────
# ⚠ 6.12 里 **不存在** CONFIG_USB_CHIPIDEA_ULPI 这个符号：
#   drivers/usb/chipidea/Kconfig 只有 USB_CHIPIDEA{,_UDC,_HOST,_PCI,_MSM,_NPCM,_IMX,_GENERIC,_TEGRA}；
#   代码里也没有任何 #ifdef CONFIG_USB_CHIPIDEA_ULPI。
#   ULPI viewport 支持是无条件编进 ci_hdrc.o 的（Makefile: ci_hdrc-y := core.o otg.o debug.o ulpi.o），
#   DT 里 phy_type="ulpi" 就会走 ci_ulpi_init()。真正要保证的是下面这些：
CONFIG_USB=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_ROOT_HUB_TT=y
CONFIG_USB_CHIPIDEA=y
CONFIG_USB_CHIPIDEA_HOST=y
# ← Zynq glue：ci_hdrc_usb2.o，匹配 "xlnx,zynq-usb-2.20a"，没有它 &usb0 不会 probe
CONFIG_USB_CHIPIDEA_GENERIC=y
CONFIG_USB_ULPI=y
CONFIG_USB_ULPI_BUS=y
# ← 6.12 的真实符号（旧文档/CONFIG_USB_CHIPIDEA_ULPI 就是它）
CONFIG_USB_ULPI_VIEWPORT=y
# ← DT 里 usb-phy = <&usb_phy0> 指向 "usb-nop-xceiv" 时需要
CONFIG_NOP_USB_XCEIV=y

# 保留 gadget（dr_mode=host 后不再使用，但不删，便于回退）
CONFIG_USB_GADGET=y
CONFIG_USB_GADGET_XILINX=y

# ── USB 网卡（摄像头模拟成 USB 网卡：NCM / ECM / RNDIS）────────────────────
# 符号在 drivers/net/usb/Kconfig（6.12 已无 drivers/usb/net/ 目录），名字与旧版一致
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_RNDIS_HOST=y
CONFIG_USB_NET_CDC_SUBSET=y
CONFIG_MII=y

# ── USB 视频类（UVC，可选：插普通 UVC 摄像头也能用）────────────────────────
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_USB_VIDEO_CLASS=y
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y

# ── CMA：16MB → 192MB ──────────────────────────────────────────────────────
# 依据（项目实测）：加速器 arena 24 槽 66.2MB + 显示双缓冲 720p 5.5MB
#   (1080p 12.4MB) + XRT 数 MB ≈ 80MB 峰值；192MB 给 2.4× 余量。
#   DDR 1GB（DTB memory@0 reg=<0x0 0x40000000>）→ Linux 仍剩 ≈810MB 普通内存，
#   算法本身的 numpy/BLAS 缓冲走普通内存，不占 CMA。
#   注：CMA 是可迁移区域，内核能临时借用；如需调参，改 bootargs 的 cma=192M
#   即可，不必重编内核。
CONFIG_CMA=y
CONFIG_CMA_SIZE_MBYTES=192
CONFIG_CMA_SIZE_SEL_MBYTES=y
